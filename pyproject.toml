[project]
name = "maxidom-hack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maxim Abramov", email = "abramovmaxim.894@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "numpy>=2.0.2",
    "ollama>=0.6.3",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.66.1",
    "torchvision>=0.29.1",
]

[project.scripts]
maxidom-hack = "maxidom_hack:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Apple Silicon: MLX, без torch
frida-mlx = [
    "frida-decisions[mlx] @ git+https://github.com/ai-forever/FRIDA-Decisions@v0.4.0",
]
# Linux/Windows с NVIDIA, Mac с MPS fallback: PyTorch
frida-torch = [
    "frida-decisions[torch] @ git+https://github.com/ai-forever/FRIDA-Decisions@v0.4.0",
]
