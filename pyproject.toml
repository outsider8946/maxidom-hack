[project]
name = "maxidom-hack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maxim Abramov", email = "abramovmaxim.894@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "ipywidgets>=8.1.9",
    "jupyterlab-widgets>=3.0.17",
    "numpy>=2.0.2",
    "ollama>=0.6.3",
    "pandas>=2.2.0",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.66.1",
    "torchvision>=0.29.1",
    "torch>=2.14",
]

[project.scripts]
maxidom-hack = "maxidom_hack:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]

[project.optional-dependencies]
# Apple Silicon: MLX, без torch
frida-mlx = [
    "frida-decisions[mlx] @ git+https://github.com/ai-forever/FRIDA-Decisions@v0.4.0",
]
# Linux/Windows с NVIDIA, Mac с MPS fallback: PyTorch
frida-torch = [
    "frida-decisions[torch] @ git+https://github.com/ai-forever/FRIDA-Decisions@v0.4.0",
]

[tool.mypy]
python_version = "3.11"
files = ["src/maxidom_hack", "app.py"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
exclude = ["notebooks"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true